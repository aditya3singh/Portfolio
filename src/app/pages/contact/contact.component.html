<div class="p-8 pb-12">
  <header class="mb-10">
    <h2 class="font-headline-lg text-headline-lg text-on-surface relative inline-block">
      Contact
      <span class="absolute -bottom-2 left-0 w-12 h-1.5 bg-primary rounded-full"></span>
    </h2>
  </header>

  <div
    class="mb-12 rounded-2xl overflow-hidden border border-outline-variant h-[400px] relative transition-all duration-700 bg-surface-container-lowest"
  >
    @if (!mapLoaded) {
      <div class="absolute inset-0 bg-surface-container-lowest animate-pulse"></div>
    }
    <div class="w-full h-full map-container">
      <iframe
        allowfullscreen
        class="w-full h-full border-0"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        [src]="mapUrl"
        title="Map of Phagwara, Punjab"
        (load)="onMapLoad()"
      ></iframe>
    </div>
  </div>

  <section>
    <h3 class="font-headline-sm text-headline-sm text-on-surface mb-6">Contact Form</h3>
    <form class="grid grid-cols-1 md:grid-cols-2 gap-6" [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="flex flex-col gap-6">
        <input
          class="w-full contact-input p-4 text-on-surface font-body-md"
          formControlName="fullname"
          placeholder="Full name"
          type="text"
        />
        <input
          class="w-full contact-input p-4 text-on-surface font-body-md"
          formControlName="email"
          placeholder="Email address"
          type="email"
        />
      </div>
      <div>
        <textarea
          class="w-full contact-input p-4 text-on-surface font-body-md min-h-[148px] resize-none"
          formControlName="message"
          placeholder="Your Message"
          rows="5"
        ></textarea>
      </div>
      @if (errorMessage) {
        <div
          class="md:col-span-2 p-4 rounded-xl border border-red-500/40 bg-red-500/10 text-on-surface"
        >
          <p class="font-body-md text-body-md">{{ errorMessage }}</p>
        </div>
      }

      <div class="md:col-span-2 flex justify-end mt-2">
        <button
          type="submit"
          class="group flex items-center gap-2 px-10 py-4 rounded-xl font-label-md font-bold shadow-lg transition-all duration-300 active:scale-95 disabled:opacity-80"
          [ngClass]="{
            'bg-primary text-on-primary shadow-primary/20 hover:shadow-primary/30 hover:scale-[1.02]':
              submitState === 'idle' || submitState === 'error',
            'bg-green-500 text-white': submitState === 'sent'
          }"
          [disabled]="submitState === 'sending'"
        >
          @if (submitState === 'sending') {
            <span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span>
            Sending...
          } @else if (submitState === 'sent') {
            <span class="material-symbols-outlined text-[20px]">check_circle</span>
            Message Sent!
          } @else if (submitState === 'error') {
            <span class="material-symbols-outlined text-[20px]">error</span>
            Try Again
          } @else {
            <span class="material-symbols-outlined text-[20px]">send</span>
            Send Message
          }
        </button>
      </div>
    </form>
  </section>
</div>
