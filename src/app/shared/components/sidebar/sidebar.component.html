<aside
  class="w-full lg:w-[280px] rounded-xl h-fit lg:sticky lg:top-8 p-stack-gap border border-outline-variant bg-surface-container-low shadow-xl flex flex-col gap-stack-gap"
>
  <div class="flex flex-row lg:flex-col items-center gap-4">
    <div
      class="w-20 lg:w-32 aspect-square rounded-2xl overflow-hidden bg-surface-container-highest flex items-center justify-center shrink-0"
    >
      <img
        [alt]="'Portrait of ' + profile.name"
        class="w-full h-full object-cover object-top"
        [src]="profile.portrait"
      />
    </div>
    <div class="text-left lg:text-center min-w-0">
      <h1 class="font-headline-sm text-headline-sm text-on-surface">{{ profile.name }}</h1>
      <span
        class="inline-block px-3 py-1 mt-2 rounded-lg bg-surface-variant font-label-md text-label-md text-on-surface-variant"
        >{{ profile.title }}</span
      >
    </div>
  </div>

  <hr class="border-outline-variant hidden lg:block" />

  <div class="flex flex-col gap-4" [class.hidden]="!showContacts" [class.lg:flex]="true">
    <div class="flex items-center gap-4 group transition-all duration-200 hover:translate-x-1">
      <div
        class="w-10 h-10 rounded-lg bg-surface-container-highest flex items-center justify-center shadow-sm shrink-0"
      >
        <span class="material-symbols-outlined text-primary text-lg">mail</span>
      </div>
      <div class="min-w-0">
        <p class="font-label-md text-[12px] uppercase tracking-wider text-on-surface-variant">Email</p>
        <a
          class="font-body-md text-body-md text-on-surface truncate block hover:text-primary transition-colors"
          [href]="'mailto:' + profile.email"
          >{{ profile.email }}</a
        >
      </div>
    </div>

    <div class="flex items-center gap-4 group transition-all duration-200 hover:translate-x-1">
      <div
        class="w-10 h-10 rounded-lg bg-surface-container-highest flex items-center justify-center shadow-sm shrink-0"
      >
        <span class="material-symbols-outlined text-primary text-lg">smartphone</span>
      </div>
      <div>
        <p class="font-label-md text-[12px] uppercase tracking-wider text-on-surface-variant">Phone</p>
        <a
          class="font-body-md text-body-md text-on-surface hover:text-primary transition-colors"
          [href]="phoneTel"
          >{{ profile.phone }}</a
        >
      </div>
    </div>

    <div class="flex items-center gap-4 group transition-all duration-200 hover:translate-x-1">
      <div
        class="w-10 h-10 rounded-lg bg-surface-container-highest flex items-center justify-center shadow-sm shrink-0"
      >
        <span class="material-symbols-outlined text-primary text-lg">location_on</span>
      </div>
      <div>
        <p class="font-label-md text-[12px] uppercase tracking-wider text-on-surface-variant">Location</p>
        <p class="font-body-md text-body-md text-on-surface">{{ profile.location }}</p>
      </div>
    </div>
  </div>

  <button
    type="button"
    class="lg:hidden w-full mt-2 py-3 rounded-xl border border-outline-variant text-primary font-label-md hover:bg-primary/10 transition-all duration-300 active:scale-95"
    (click)="toggleContacts()"
  >
    {{ showContacts ? 'Hide Contacts' : 'Show Contacts' }}
  </button>

  <div class="flex justify-center gap-4 mt-2">
    <a
      class="text-on-surface-variant hover:text-primary transition-all"
      [href]="profile.linkedin"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="LinkedIn"
    >
      <span class="material-symbols-outlined">work</span>
    </a>
    <a
      class="text-on-surface-variant hover:text-primary transition-all"
      [href]="profile.github"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="GitHub"
    >
      <span class="material-symbols-outlined">code</span>
    </a>
    <a
      class="text-on-surface-variant hover:text-primary transition-all"
      [href]="'mailto:' + profile.email"
      aria-label="Email"
    >
      <span class="material-symbols-outlined">mail</span>
    </a>
  </div>
</aside>
