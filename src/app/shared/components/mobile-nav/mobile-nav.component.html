<nav
  class="lg:hidden fixed bottom-4 left-4 right-4 z-[100] backdrop-blur-xl bg-surface-variant/90 border border-outline-variant rounded-xl flex items-center justify-around px-4 py-3 shadow-2xl"
>
  @for (item of navItems; track item.path) {
    <a
      class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary transition-all"
      [routerLink]="item.path"
      routerLinkActive="!text-primary"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <span
        class="material-symbols-outlined text-[22px]"
        [style.font-variation-settings]="'FILL 1'"
        >{{ item.icon }}</span
      >
      <span class="text-[10px] font-bold uppercase tracking-tighter">{{ item.label }}</span>
    </a>
  }
</nav>
